name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  etape:
    name: Étape ${{ matrix.etape }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        etape: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Tests de l'étape ${{ matrix.etape }}
        run: composer run test:etape-${{ matrix.etape }}

  bonus:
    name: Bonus JPG
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Tests du bonus
        run: composer run test:bonus
